<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6a4935">
<title>Felix' Abschiedsbuch – Mobile Fix</title>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#e8dfd2;color:#4b3325;font-family:Georgia,"Times New Roman",serif}
.toolbar{position:sticky;top:0;z-index:30;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;background:rgba(255,255,255,.98);border-bottom:1px solid #d8c5b4}
button{border:0;border-radius:999px;padding:10px 14px;background:#6a4935;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#9a7459}
.status{text-align:center;padding:7px 12px;font:12px Arial,sans-serif;color:#6b5545;min-height:30px}
.wrap{display:flex;justify-content:center;padding:10px}
.page{position:relative;width:min(98vw,827px);aspect-ratio:1191/1684;background:url('background.png?v=4') center/100% 100% no-repeat;box-shadow:0 12px 30px #0002;overflow:hidden}
.field{position:absolute;border:0;outline:0;background:transparent;color:#3f2c21;font-family:Georgia,serif;font-size:clamp(11px,1.5vw,16px);line-height:1.35;padding:0 3px;resize:none;overflow:hidden}
.field:focus{background:rgba(255,255,255,.26)}
#name{left:27.9%;top:20.2%;width:34.8%;height:2.4%}
#since{left:21.1%;top:28.0%;width:41.8%;height:5.4%}
#moment{left:21.1%;top:38.4%;width:41.8%;height:7.0%}
#traits{left:21.1%;top:49.8%;width:50.5%;height:7.1%}
#suitcase{left:21.1%;top:60.6%;width:50.5%;height:7.1%}
#texas{left:21.1%;top:71.8%;width:54.5%;height:5.4%}
#wish{left:21.1%;top:79.0%;width:54.5%;height:7.7%}
.photo{position:absolute;overflow:hidden;background:rgba(255,255,255,.08)}
.photo input{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:3;cursor:pointer}
.photo label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed rgba(106,73,53,.45);background:rgba(255,255,255,.24);color:#795a43;font:600 clamp(10px,1.25vw,14px) Arial,sans-serif;padding:5px;pointer-events:none;z-index:2}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1}
#photo1{left:66.5%;top:20.4%;width:20.5%;height:12.4%}
#photo2{left:66.5%;top:34.6%;width:20.5%;height:12.4%}
#photo3{left:24.4%;top:85.8%;width:15.95%;height:11.25%}
#photo4{left:40.35%;top:85.8%;width:15.95%;height:11.25%}
#photo5{left:56.3%;top:85.8%;width:15.95%;height:11.25%}
.help{max-width:850px;margin:0 auto 16px;padding:0 14px;font:13px/1.45 Arial,sans-serif;color:#6b5545;text-align:center}
.version{font:11px Arial,sans-serif;text-align:center;color:#8d7666;padding-bottom:8px}
@media(max-width:600px){.toolbar button{font-size:11px;padding:9px 11px}.field{font-size:11px}.status,.help{font-size:11px}}
</style>
</head>
<body>
<div class="toolbar">
 <button id="saveImage">Als Bild speichern</button>
 <button id="printPdf" class="secondary">PDF / Drucken</button>
 <button id="clearAll" class="secondary">Alles löschen</button>
</div>
<div class="status" id="status">Bereit. Tippe auf ein Fotofeld.</div>
<div class="wrap">
<main class="page" id="page">
 <input class="field" id="name" aria-label="Name">
 <textarea class="field" id="since" aria-label="Seit wann kennen wir uns"></textarea>
 <textarea class="field" id="moment" aria-label="Bester gemeinsamer Moment"></textarea>
 <textarea class="field" id="traits" aria-label="Eigenschaften"></textarea>
 <textarea class="field" id="suitcase" aria-label="Koffer"></textarea>
 <textarea class="field" id="texas" aria-label="Texas erleben"></textarea>
 <textarea class="field" id="wish" aria-label="Wunsch"></textarea>

 <div class="photo" id="photo1"><input type="file" id="file1" accept="image/*,.heic,.heif"><label>Foto hinzufügen</label><img alt=""></div>
 <div class="photo" id="photo2"><input type="file" id="file2" accept="image/*,.heic,.heif"><label>Foto hinzufügen</label><img alt=""></div>
 <div class="photo" id="photo3"><input type="file" id="file3" accept="image/*,.heic,.heif"><label>Foto hinzufügen</label><img alt=""></div>
 <div class="photo" id="photo4"><input type="file" id="file4" accept="image/*,.heic,.heif"><label>Foto hinzufügen</label><img alt=""></div>
 <div class="photo" id="photo5"><input type="file" id="file5" accept="image/*,.heic,.heif"><label>Foto hinzufügen</label><img alt=""></div>
</main>
</div>
<div class="help">iPhone und Android: Fotofeld antippen, Bild auswählen und kurz warten. HEIC-Fotos vom iPhone werden automatisch umgewandelt.</div>
<div class="version">Version Mobile Fix 4</div>

<script>
const textIds=['name','since','moment','traits','suitcase','texas','wish'];
const photoIds=['1','2','3','4','5'];
const TEXT_KEY='felix_text_mobile_fix4';
const DB_NAME='felix_mobile_fix4';
const STORE='photos';
let dbPromise;

function setStatus(msg){document.getElementById('status').textContent=msg}

function openDB(){
 if(dbPromise)return dbPromise;
 dbPromise=new Promise((resolve,reject)=>{
   const req=indexedDB.open(DB_NAME,1);
   req.onupgradeneeded=()=>{
     const db=req.result;
     if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE);
   };
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error);
 });
 return dbPromise;
}
async function dbPut(key,value){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction(STORE,'readwrite');
   tx.objectStore(STORE).put(value,key);
   tx.oncomplete=resolve;
   tx.onerror=()=>reject(tx.error);
 });
}
async function dbGet(key){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
   const req=db.transaction(STORE,'readonly').objectStore(STORE).get(key);
   req.onsuccess=()=>resolve(req.result||null);
   req.onerror=()=>reject(req.error);
 });
}
async function dbClear(){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction(STORE,'readwrite');
   tx.objectStore(STORE).clear();
   tx.oncomplete=resolve;
   tx.onerror=()=>reject(tx.error);
 });
}

function saveText(){
 const data={};
 textIds.forEach(id=>data[id]=document.getElementById(id).value);
 localStorage.setItem(TEXT_KEY,JSON.stringify(data));
}
function loadText(){
 try{
   const data=JSON.parse(localStorage.getItem(TEXT_KEY)||'{}');
   textIds.forEach(id=>document.getElementById(id).value=data[id]||'');
 }catch(e){}
}
textIds.forEach(id=>document.getElementById(id).addEventListener('input',saveText));

function blobToDataURL(blob){
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=()=>resolve(reader.result);
   reader.onerror=reject;
   reader.readAsDataURL(blob);
 });
}
function dataURLToBlob(dataURL){
 const parts=dataURL.split(',');
 const mime=parts[0].match(/:(.*?);/)[1];
 const bytes=atob(parts[1]);
 const arr=new Uint8Array(bytes.length);
 for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);
 return new Blob([arr],{type:mime});
}
function loadImg(src){
 return new Promise((resolve,reject)=>{
   const img=new Image();
   img.onload=()=>resolve(img);
   img.onerror=reject;
   img.src=src;
 });
}
async function normalizeImage(file){
 let working=file;
 const name=(file.name||'').toLowerCase();
 const type=(file.type||'').toLowerCase();
 const isHeic=type.includes('heic')||type.includes('heif')||name.endsWith('.heic')||name.endsWith('.heif');
 if(isHeic){
   if(typeof heic2any!=='function')throw new Error('HEIC-Konverter nicht geladen');
   setStatus('iPhone-Foto wird umgewandelt …');
   working=await heic2any({blob:file,toType:'image/jpeg',quality:0.88});
   if(Array.isArray(working))working=working[0];
 }
 const src=await blobToDataURL(working);
 const img=await loadImg(src);
 const max=1400;
 const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
 const canvas=document.createElement('canvas');
 canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
 canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
 const ctx=canvas.getContext('2d');
 ctx.drawImage(img,0,0,canvas.width,canvas.height);
 return dataURLToBlob(canvas.toDataURL('image/jpeg',0.82));
}
async function showBlob(n,blob){
 const box=document.getElementById('photo'+n);
 const img=box.querySelector('img');
 const label=box.querySelector('label');
 const url=URL.createObjectURL(blob);
 img.onload=()=>{
   label.style.display='none';
   img.style.display='block';
   URL.revokeObjectURL(url);
   setStatus('Foto eingefügt ✓');
 };
 img.onerror=()=>{
   URL.revokeObjectURL(url);
   setStatus('Foto konnte nicht angezeigt werden.');
 };
 img.src=url;
}
async function restorePhotos(){
 for(const n of photoIds){
   try{
     const blob=await dbGet('photo'+n);
     if(blob)await showBlob(n,blob);
   }catch(e){}
 }
}
photoIds.forEach(n=>{
 const input=document.getElementById('file'+n);
 input.addEventListener('change',async()=>{
   const file=input.files&&input.files[0];
   if(!file)return;
   setStatus('Foto wird geladen …');
   try{
     const normalized=await normalizeImage(file);
     await dbPut('photo'+n,normalized);
     await showBlob(n,normalized);
   }catch(err){
     console.error(err);
     alert('Das Foto konnte nicht verarbeitet werden. Bitte wähle einen Screenshot oder ein JPG/PNG.');
     setStatus('Fehler beim Einfügen.');
   }
   input.value='';
 });
});

async function render(){
 const canvas=document.createElement('canvas');
 canvas.width=1191;canvas.height=1684;
 const ctx=canvas.getContext('2d');
 const bg=await loadImg('background.png?v=4');
 ctx.drawImage(bg,0,0,1191,1684);
 ctx.fillStyle='#3f2c21';
 ctx.font='22px Georgia';
 ctx.textBaseline='top';

 const boxes={name:[332,340,416,40],since:[251,458,498,85],moment:[251,620,498,115],traits:[251,820,602,120],suitcase:[251,1000,602,120],texas:[251,1180,649,90],wish:[251,1330,649,125]};
 function wrap(text,x,y,w,h){
   const words=(text||'').split(/\s+/);
   let line='',lines=[];
   for(const word of words){
     const test=line?line+' '+word:word;
     if(ctx.measureText(test).width>w&&line){lines.push(line);line=word}else line=test;
   }
   if(line)lines.push(line);
   lines.slice(0,Math.floor(h/31)).forEach((l,i)=>ctx.fillText(l,x,y+i*31));
 }
 for(const id of textIds){
   const b=boxes[id],v=document.getElementById(id).value;
   if(!v)continue;
   if(id==='name')ctx.fillText(v,b[0],b[1]);
   else wrap(v,b[0],b[1],b[2],b[3]);
 }

 const pboxes={1:[792,343,245,208],2:[792,582,245,208],3:[290,1444,190,190],4:[480,1444,190,190],5:[670,1444,190,190]};
 for(const n of photoIds){
   const blob=await dbGet('photo'+n);
   if(!blob)continue;
   const src=await blobToDataURL(blob);
   const im=await loadImg(src);
   const b=pboxes[n];
   const scale=Math.max(b[2]/im.width,b[3]/im.height);
   const dw=im.width*scale,dh=im.height*scale;
   ctx.save();ctx.beginPath();ctx.rect(b[0],b[1],b[2],b[3]);ctx.clip();
   ctx.drawImage(im,b[0]+(b[2]-dw)/2,b[1]+(b[3]-dh)/2,dw,dh);
   ctx.restore();
 }
 return canvas;
}
function download(data,name){
 const a=document.createElement('a');
 a.href=data;a.download=name;
 document.body.appendChild(a);a.click();a.remove();
}
document.getElementById('saveImage').onclick=async()=>{
 setStatus('Bild wird erstellt …');
 const c=await render();
 download(c.toDataURL('image/jpeg',0.93),'Felix_Abschiedsbuch.jpg');
 setStatus('Bild gespeichert ✓');
};
document.getElementById('printPdf').onclick=async()=>{
 setStatus('PDF wird vorbereitet …');
 const c=await render();
 const data=c.toDataURL('image/jpeg',0.94);
 const w=window.open('','_blank');
 if(!w){alert('Bitte Pop-ups erlauben.');return}
 w.document.write('<!doctype html><meta name="viewport" content="width=device-width"><style>@page{size:A4;margin:0}html,body{margin:0}img{width:100%;display:block}</style><img src="'+data+'" onload="setTimeout(()=>window.print(),500)">');
 w.document.close();
};
document.getElementById('clearAll').onclick=async()=>{
 if(!confirm('Wirklich alles löschen?'))return;
 localStorage.removeItem(TEXT_KEY);
 await dbClear();
 textIds.forEach(id=>document.getElementById(id).value='');
 photoIds.forEach(n=>{
   const box=document.getElementById('photo'+n);
   box.querySelector('img').style.display='none';
   box.querySelector('label').style.display='flex';
 });
 setStatus('Alles gelöscht');
};

loadText();
restorePhotos();
</script>
</body>
</html>
